name: Website checks and deployment

# Pull requests: build and test only. A push to main (a direct push or a merged pull request)
# deploys that commit to Cloudflare Pages once PAGES_DEPLOY_ENABLED=true. See
# deploy/github-actions.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every value here is public: PUBLIC_* vars are inlined into the client bundle at build time
# and visible in the page source of datonum.com.
env:
  PUBLIC_HUBSPOT_PORTAL_ID: '147885520'
  PUBLIC_HUBSPOT_FORM_GUID: cf2fcf59-3620-44ec-894c-afe8894d43fe
  PUBLIC_HUBSPOT_REGION: eu1
  PUBLIC_UMAMI_SRC: https://umami.datonum.com/script.js
  PUBLIC_UMAMI_RECORDER_SRC: https://umami.datonum.com/recorder.js
  PUBLIC_UMAMI_WEBSITE_ID: 0feaa907-bf0b-4941-9317-c02205f52595
  PUBLIC_UMAMI_DOMAINS: datonum.com,www.datonum.com
  PUBLIC_LINKEDIN_PARTNER_ID: '11110585'
  PAGES_PROJECT: datonum-website
  WRANGLER_VERSION: '4.169.0'

jobs:
  check:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/deployment.test.mjs
      - name: Build
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: npm run build && node scripts/write-deployment-marker.mjs
      - name: Pages control files are in the build output
        run: test -s dist/_redirects && test -s dist/_headers && test -s dist/deployment.json

  deploy:
    name: Deploy datonum.com to Cloudflare Pages
    needs: check
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.PAGES_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://datonum.com
    concurrency:
      group: datonum-production
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CUSTOM_DOMAIN_LIVE: ${{ vars.PAGES_CUSTOM_DOMAIN_LIVE == 'true' }}
    steps:
      - name: Skip if a newer main commit exists
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          if [ "$head" = "$DEPLOY_SHA" ]; then echo 'latest=true' >> "$GITHUB_OUTPUT"
          else echo 'latest=false' >> "$GITHUB_OUTPUT"; echo "Superseded by $head; nothing deployed." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.current.outputs.latest == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.current.outputs.latest == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Build the exact commit
        if: steps.current.outputs.latest == 'true'
        run: npm ci && npm run build && node scripts/write-deployment-marker.mjs
      - name: Ensure the Pages project and remember the live deployment
        id: before
        if: steps.current.outputs.latest == 'true'
        run: |
          set -euo pipefail
          for setting in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!setting}" ] || { echo "::error::Missing $setting. See deploy/github-actions.md."; exit 1; }
          done
          node deploy/pages.mjs ensure
          echo "previous=$(node deploy/pages.mjs production)" >> "$GITHUB_OUTPUT"

      # 1. Upload as a preview first and check it, so a broken build never becomes production.
      - name: Upload preview
        id: preview
        if: steps.current.outputs.latest == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=verify --commit-hash=${{ github.sha }} --commit-dirty=true
      - name: Verify preview
        if: steps.current.outputs.latest == 'true'
        run: node deploy/verify-site.mjs --origin "${{ steps.preview.outputs.deployment-url }}" --commit "$DEPLOY_SHA"

      # 2. Promote: the same files as the production deployment (main branch).
      - name: Deploy production
        id: release
        if: steps.current.outputs.latest == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
      - name: Verify production deployment
        if: steps.current.outputs.latest == 'true'
        run: node deploy/verify-site.mjs --origin "${{ steps.release.outputs.deployment-url }}" --commit "$DEPLOY_SHA"

      # 3. datonum.com itself, once the custom domain points at Pages (PAGES_CUSTOM_DOMAIN_LIVE).
      - name: Purge Cloudflare cache
        if: steps.current.outputs.latest == 'true' && env.CUSTOM_DOMAIN_LIVE == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
        run: node deploy/cloudflare.mjs purge
      - name: Verify datonum.com
        if: steps.current.outputs.latest == 'true' && env.CUSTOM_DOMAIN_LIVE == 'true'
        run: node deploy/verify-site.mjs --commit "$DEPLOY_SHA"

      - name: Roll back production if verification failed
        if: failure() && steps.release.outcome != 'skipped' && steps.before.outputs.previous != ''
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          node deploy/pages.mjs rollback "${{ steps.before.outputs.previous }}"
          if [ "$CUSTOM_DOMAIN_LIVE" = true ]; then node deploy/cloudflare.mjs purge; fi
          echo 'Deployment failed verification; production was rolled back to the previous Pages deployment.' >> "$GITHUB_STEP_SUMMARY"
      - name: Notify IndexNow after verified deployment
        if: success() && steps.current.outputs.latest == 'true' && env.CUSTOM_DOMAIN_LIVE == 'true'
        continue-on-error: true
        id: indexnow
        run: npm run indexnow
      - name: Record deployment outcome
        if: success() && steps.current.outputs.latest == 'true'
        run: |
          echo "Verified Pages deployment: $DEPLOY_SHA (${{ steps.release.outputs.deployment-url }})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CUSTOM_DOMAIN_LIVE" != true ]; then
            echo 'datonum.com is not on Pages yet (PAGES_CUSTOM_DOMAIN_LIVE is not true); only the pages.dev deployment was checked.' >> "$GITHUB_STEP_SUMMARY"
          fi
