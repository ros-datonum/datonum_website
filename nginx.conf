# Serves the Astro static build inside the container. Host Caddy terminates TLS and
# reverse-proxies to this on a local port (see docker-compose.yml).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;

    # Root document.
    location = / {
        try_files /index.html =404;
    }

    # Clean URLs for Astro's directory output: /about -> /about/index.html served
    # directly (no trailing-slash 301). Unknown paths 404.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Fingerprinted assets are immutable — cache hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
