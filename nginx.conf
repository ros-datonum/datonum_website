# Serves the Astro static build inside the container. The shared Caddy container on the
# ai_stack_public_proxy network terminates TLS and reverse-proxies to port 80 here
# (see docker-compose.yml).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;

    # No access log: requests arrive through Caddy with the visitor's IP in X-Forwarded-For
    # (and Cloudflare's CF-Connecting-IP), which the image's default log format records.
    # Error lines show only the Caddy container's address as "client".
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # llms.txt and robots.txt are UTF-8 plain text; declare it so no client has to guess.
    charset utf-8;

    # Redirects carry a path only: TLS and the public host live on Caddy, not here.
    absolute_redirect off;

    error_page 404 /404.html;

    # One public URL per page, no trailing slash and no file suffix. Every other spelling
    # 301s to it so search engines never see duplicates. Matched against the original
    # request URI, so the internal /about -> /about.html lookup below is not caught.
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 /$is_args$args;
    }
    if ($request_uri ~ ^(/[^?]*?)(/index\.html|\.html|/)(\?.*)?$) {
        return 301 $1$is_args$args;
    }

    # Root document.
    location = / {
        try_files /index.html =404;
    }

    # Astro builds /about to /about.html (build.format: 'file'). Unknown paths 404.
    location / {
        try_files $uri $uri.html =404;
    }

    # The not-found page is only ever served with a 404 status, never as a page of its own.
    location = /404.html {
        internal;
    }
    location = /404 {
        return 404;
    }

    # Fingerprinted assets are immutable — cache hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fonts and brand artwork keep stable filenames, so they are cached long but not
    # immutable: a replaced file is picked up once the cache entry expires.
    location ~ ^/(fonts|brand)/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
