# Server-log retention (Privacy Notice §7: up to 14 days). Install as
# /etc/systemd/journald.conf.d/retention.conf, then: systemctl restart systemd-journald
#
# journald deletes whole journal files, so files are cut daily and dropped after 13 days:
# the oldest entry on disk is then at most 14 days old. This applies to the whole journal
# (the website container, Caddy if it logs to the journal, cron, sshd, ...).
[Journal]
MaxFileSec=1day
MaxRetentionSec=13day
