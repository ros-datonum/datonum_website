# Deploy on the VPS: `docker compose up -d --build`
# Standalone container — no shared network with Caddy. The host's Caddy reaches it via
# host.docker.internal:8080 and handles TLS.
services:
  datonum-website:
    build: .
    image: datonum-website
    container_name: datonum-website
    restart: unless-stopped
    networks:
      - ai_stack_public_proxy
    expose:
      - "80"
    # nginx writes access and error logs to stdout/stderr. Send them to the journal, whose
    # age-based retention (deploy/journald-retention.conf) keeps them for up to 14 days;
    # Docker's json-file driver can only rotate by size.
    logging:
      driver: journald
      options:
        tag: datonum-website

networks:
  ai_stack_public_proxy:
    external: true
    name: ai_stack_public_proxy
