# Deploy on the VPS: `docker compose up -d --build`
# Caddy runs in its own container and reverse-proxies to this one over a shared Docker
# network, reaching it by name on its internal port 80 (no host port needed).
services:
  web:
    build: .
    image: datonum-website
    container_name: datonum-website
    restart: unless-stopped
    networks:
      - caddy
    # For local debugging you can also expose it on the host loopback:
    # ports:
    #   - "127.0.0.1:8080:80"

networks:
  # The Docker network your Caddy container is attached to. Rename this key to match.
  # Find it: docker inspect -f '{{json .NetworkSettings.Networks}}' <caddy-container>
  caddy:
    external: true
